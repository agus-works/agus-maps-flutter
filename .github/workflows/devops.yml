            | macOS | `agus-binaries-macos-${{ github.ref_name }}.zip` | XCFramework for macOS (auto-downloaded) |
            
            > These are automatically downloaded by the CocoaPods `prepare_command` for pub.dev consumers.
            > You still need to extract the unified package for assets.
            
