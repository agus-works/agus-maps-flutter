name: agus_maps_flutter
description: High-performance offline vector maps for Flutter using the CoMaps rendering engine.
version: 0.1.24
homepage: https://agus.app
repository: https://github.com/agus-works/agus-maps-flutter
environment:
  sdk: ^3.6.0
  flutter: '>=3.3.0'

workspace:
  - example
  - packages/agus_design
  - packages/agus_design/example
  - tool/skin_generator_tool
  - widgetbook

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  ffi: ^2.1.3
  # For MWM storage persistence
  shared_preferences: ^2.2.0
  # For HTTP requests (mirror service)
  http: ^1.1.0
  # For Dart hooks (build orchestration)
  hooks: ^2.0.0
  # For archive operations (compress/extract)
  archive: ^4.0.7
  # For YAML parsing (pubspec.yaml)
  yaml: ^3.1.2
  # For path operations (cross-platform)
  path: ^1.9.1

dev_dependencies:
  args: ^2.5.0
  pigeon: ^26.3.4
  ffigen: ^20.1.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  melos: ^7.0.0
  yaml_edit: ^2.1.1

melos:
  useRootAsPackage: true
  ide:
    intellij:
      enabled: false
  categories:
    plugin:
      - .
    apps:
      - example
    packages:
      - packages/**
    tools:
      - tool/**
    widgetbook:
      - widgetbook
    design:
      - packages/agus_design
      - packages/agus_design/example
      - widgetbook
  scripts:
    analyze:
      description: Analyze workspace packages that have a clean analyzer baseline.
      run: dart run melos exec -c 1 --ignore=agus_maps_flutter --ignore=skin_generator_tool -- flutter analyze .
    test:
      description: Run Flutter tests for packages that have a test directory.
      run: dart run melos exec -c 1 --dir-exists=test -- flutter test
    design:analyze:
      description: Analyze only the fast Agus design package and Widgetbook.
      steps:
        - dart run melos exec --scope=agus_design -- flutter analyze .
        - dart run melos exec --scope=agus_design_widgetbook -- flutter analyze .
    design:test:
      description: Run tests for the fast Agus design package only.
      run: dart run melos exec --scope=agus_design -- flutter test
    generate:
      description: Generate build_runner outputs for packages that use generators.
      run: dart run melos exec -c 1 --depends-on=build_runner -- dart run build_runner build --delete-conflicting-outputs
    widgetbook:
      description: Run the Agus design Widgetbook on Chrome.
      run: dart run melos exec --scope=agus_design_widgetbook -- flutter run -d chrome

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # This section identifies this Flutter project as a plugin project.
  # The 'pluginClass' specifies the class (in Java, Kotlin, Swift, Objective-C, etc.)
  # which should be registered in the plugin registry. This is required for
  # using method channels.
  # The Android 'package' specifies package in which the registered class is.
  # This is required for using method channels on Android.
  # The 'ffiPlugin' specifies that native code should be built and bundled.
  # This is required for using `dart:ffi`.
  # All these are used by the tooling to maintain consistency when
  # adding or updating assets for this project.
  #
  # Please refer to README.md for a detailed explanation.
  # NOTE: This plugin does not ship assets. Assets are generated into
  # example/assets during builds and packaged into release zips.
  plugin:
    platforms:
      android:
        package: app.agus.maps.agus_maps_flutter
        pluginClass: AgusMapsFlutterPlugin
        ffiPlugin: true
      ios:
        pluginClass: AgusMapsFlutterPlugin
        ffiPlugin: true
      linux:
        pluginClass: AgusMapsFlutterPlugin
        ffiPlugin: true
      macos:
        pluginClass: AgusMapsFlutterPlugin
        ffiPlugin: true
      windows:
        pluginClass: AgusMapsFlutterPluginCApi
        ffiPlugin: true

  # To add assets to your plugin package, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
