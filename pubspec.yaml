        ffiPlugin: true
      linux:
        pluginClass: AgusMapsFlutterPlugin
        ffiPlugin: true
      macos:
        pluginClass: AgusMapsFlutterPlugin
        ffiPlugin: true
      windows:
        pluginClass: AgusMapsFlutterPluginCApi
        ffiPlugin: true

