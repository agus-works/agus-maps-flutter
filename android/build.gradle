// The Android Gradle Plugin builds the native code with the Android NDK.
// This build.gradle supports two modes:
// 1. In-repo build: Uses thirdparty/comaps source (for development)
// 2. External consumer: Uses pre-built libraries from GitHub Releases

group = "app.agus.maps.agus_maps_flutter"
version = "1.0"

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath("com.android.tools.build:gradle:8.11.1")
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// ============================================================================
// Build Mode Detection
// ============================================================================
// Detect if we're in the plugin repository (in-repo build from source)
// or being consumed as a dependency (external consumer with pre-built binaries)
def isInRepo = file("${projectDir}/../.git").exists() && 
               file("${projectDir}/../thirdparty/comaps").exists()

def prebuiltDir = file("${projectDir}/prebuilt")
def headersDir = file("${projectDir}/headers")

// ============================================================================
// Pre-built Binaries Required for External Consumers
// ============================================================================
// Download the unified binary package from GitHub Releases and extract it to
// your Flutter app root BEFORE building:
//
//   1. Download: https://github.com/agus-works/agus-maps-flutter/releases
//   2. Extract to your app root: unzip agus-maps-binaries-vX.Y.Z.zip -d my_app/
//   3. This creates: my_app/android/prebuilt/{arm64-v8a,armeabi-v7a,x86_64}/
//
// The build will fail if android/prebuilt/ is not present with the native libs.
// ============================================================================

android {
    namespace = "app.agus.maps.agus_maps_flutter"

    // Bumping the plugin compileSdk version requires all clients of this plugin
    // to bump the version in their app.
    compileSdk = 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Replace it with a version number if this plugin requires a specific NDK version.
    // (e.g. ndkVersion "23.1.7779620")
    ndkVersion = android.ndkVersion

    // Invoke the shared CMake build with the Android Gradle Plugin.
    externalNativeBuild {
        cmake {
            path = "../src/CMakeLists.txt"

            // The default CMake version for the Android Gradle Plugin is 3.10.2.
            // https://developer.android.com/studio/projects/install-ndk#vanilla_cmake
            //
            // The Flutter tooling requires that developers have CMake 3.10 or later
            // installed. You should not increase this version, as doing so will cause
            // the plugin to fail to compile for some customers of the plugin.
            // version "3.10.2"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdk = 24
        
        // Pass CMake arguments based on build mode
        externalNativeBuild {
            cmake {
                // Check multiple locations for pre-built binaries:
                // 1. Plugin-local (downloaded by script or manually placed): ${projectDir}/prebuilt
                // 2. Project-root (manual offline workflow): ${rootDir}/../agus_maps_flutter/android/prebuilt
                
                def manualPrebuiltDir = file("${rootDir.parentFile}/agus_maps_flutter/android/prebuilt")
                def effectivePrebuiltDir = null

                if (prebuiltDir.exists() && prebuiltDir.listFiles()?.length > 0) {
                     effectivePrebuiltDir = prebuiltDir
                } else if (manualPrebuiltDir.exists() && manualPrebuiltDir.listFiles()?.length > 0) {
                     effectivePrebuiltDir = manualPrebuiltDir
                }

                // If valid prebuilts found, use them
                if (effectivePrebuiltDir != null) {
                    arguments "-DUSE_PREBUILT_COMAPS=ON",
                              "-DPREBUILT_DIR=${effectivePrebuiltDir.absolutePath}"
                    println "Using pre-built CoMaps libraries from: ${effectivePrebuiltDir.absolutePath}"
                    
                    // Pass headers directory for external consumers
                    if (headersDir.exists() && file("${headersDir}/comaps").exists()) {
                        arguments "-DCOMAPS_HEADERS_DIR=${headersDir.absolutePath}"
                        println "Using downloaded headers from: ${headersDir.absolutePath}"
                    }
                } else if (isInRepo) {
                    println "Building CoMaps from source (in-repo development mode)"
                } else {
                    println "Warning: Pre-built libraries not found in plugin dir or project root. Build may fail."
                }
            }
        }
    }
}
